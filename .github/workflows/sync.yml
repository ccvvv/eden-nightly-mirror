name: Sync Eden APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Fetch APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s "https://git.eden-emu.dev/api/v1/repos/eden-ci/nightly/releases?limit=1" > data.json
          
          BODY=$(jq -r '.[0].body' data.json)
          VER=$(jq -r '.[0].tag_name' data.json)
          
          # 检查你的仓库中是否已经存在这个版本
          if gh release view "$VER" > /dev/null 2>&1; then
            echo "版本 $VER 已经存在，跳过爬取和下载。"
            echo "SKIP=true" >> $GITHUB_ENV
          else
            echo "发现新版本 $VER，准备下载。"
            echo "SKIP=false" >> $GITHUB_ENV
            
            # 提取 APK 链接
            APK=$(echo "$BODY" | grep -oE 'https://nightly\.eden-emu\.dev/[^" ]*Android[^" ]*\.apk' | head -n 1)
            echo "APK_URL=$APK" >> $GITHUB_ENV
            echo "VERSION=$VER" >> $GITHUB_ENV
          fi

      - name: Download and Release
        # 只有当 SKIP 为 false 且抓到了链接时才执行
        if: env.SKIP == 'false' && env.APK_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_APK_URL: ${{ env.APK_URL }}
          MY_VER: ${{ env.VERSION }}
        run: |
          curl -L -o Eden-Nightly.apk "$MY_APK_URL"
          # 因为前面已经判断过不存在，所以这里可以直接 create，不需要强制覆盖 (--clobber)
          gh release create "$MY_VER" Eden-Nightly.apk --title "Eden Nightly $MY_VER"
