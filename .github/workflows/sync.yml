name: Sync Eden APK
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK
        run: |
          curl -s "https://git.eden-emu.dev/api/v1/repos/eden-ci/nightly/releases?limit=1" > data.json
          APK=$(grep -o 'https://[^"]*Android[^"]*\.apk' data.json | head -n 1)
          VER=$(grep -o '"tag_name":"[^"]*' data.json | head -n 1 | cut -d'"' -f4)
          echo "APK_URL=$APK" >> $GITHUB_ENV
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Download and Release
        if: env.APK_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -o Eden-Nightly.apk "${{ env.APK_URL }}"
          gh release create "${{ env.VERSION }}" Eden-Nightly.apk --title "Eden Nightly ${{ env.VERSION }}" || gh release upload "${{ env.VERSION }}" Eden-Nightly.apk --clobber
